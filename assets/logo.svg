<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a86ee"/>
      <stop offset="1" stop-color="#0a66c2"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.3" cy="0.25" r="0.9">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.28"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="horn" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffe887"/>
      <stop offset="1" stop-color="#f4b400"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="2.5" stdDeviation="2.5" flood-color="#062f5c" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- tile -->
  <rect x="2" y="2" width="124" height="124" rx="30" fill="url(#bg)"/>
  <rect x="2" y="2" width="124" height="124" rx="30" fill="url(#glow)"/>

  <!-- rainbow mane (chunky lobes peeking out behind the head) -->
  <g filter="url(#soft)">
    <circle cx="92"  cy="42"  r="17" fill="#ffdf7a"/>
    <circle cx="104" cy="62"  r="17" fill="#8fe3c0"/>
    <circle cx="102" cy="86"  r="16" fill="#c7adff"/>
    <circle cx="92"  cy="104" r="14" fill="#ff9ec4"/>
  </g>

  <!-- head + muzzle -->
  <g filter="url(#soft)">
    <ellipse cx="72" cy="68" rx="33" ry="31" fill="#fffbf4"/>
    <ellipse cx="46" cy="82" rx="17" ry="14" fill="#fffbf4"/>
    <ellipse cx="46" cy="86" rx="13" ry="9" fill="#f3e7d6"/>
  </g>

  <!-- ear -->
  <path d="M96 46 Q101 28 88 34 Q86 44 92 50 Z" fill="#fffbf4"/>
  <path d="M94 45 Q97 34 90 37 Q89 43 92 47 Z" fill="#ffc1dd"/>

  <!-- horn -->
  <path d="M66 40 L60 8 L78 38 Z" fill="url(#horn)"/>
  <path d="M67 30 L74 33 M69 22 L73 24" stroke="#e59b00" stroke-width="2" stroke-linecap="round"/>

  <!-- forelock falling over the forehead (in front of the face) -->
  <path d="M66 42 Q56 44 58 58 Q62 52 66 54 Q64 44 74 46 Q72 40 66 42 Z" fill="#ff9ec4"/>
  <path d="M74 44 Q84 44 84 56 Q80 50 76 52 Q78 46 74 44 Z" fill="#ffdf7a"/>

  <!-- face -->
  <ellipse cx="60" cy="86" rx="4.4" ry="3.2" fill="#ff9ec4" opacity="0.75"/>
  <ellipse cx="40" cy="84" rx="2" ry="2.6" fill="#b98aa0"/>
  <ellipse cx="70" cy="66" rx="7.5" ry="9.5" fill="#4a3a63"/>
  <circle cx="72.6" cy="62" r="2.6" fill="#ffffff"/>
  <circle cx="68" cy="70" r="1.3" fill="#ffffff" opacity="0.8"/>

  <!-- sparkles -->
  <path d="M40 34 l2.2 5 5 2.2 -5 2.2 -2.2 5 -2.2 -5 -5 -2.2 5 -2.2 Z" fill="#ffffff"/>
  <circle cx="30" cy="52" r="2.2" fill="#ffffff" opacity="0.9"/>
  <circle cx="112" cy="40" r="2" fill="#ffffff" opacity="0.85"/>
</svg>
